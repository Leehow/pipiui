# Windows release installer on GitHub-hosted runners (the repo is public, so
# Actions minutes are free). Used when the LAN Windows box is unavailable.
#
# Triggered by pushing a `release-win-<x.y.z>` tag; it packages exactly the tagged
# commit as app version <x.y.z> with the same steps as a local `package:win` (no test gate — the
# test-bearing pipeline is electron.yml). Download the installer from the run's
# `pipiui-windows-x64` artifact.
name: release-windows

on:
  push:
    tags: ['release-win-*']

jobs:
  package:
    # windows-latest drifted to VS 18; node-gyp cannot parse that toolset.
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      # Match the embedded runtime pin in Electron/node-runtime-assets.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: Electron/package-lock.json

      - name: Install dependencies
        working-directory: Electron
        run: npm ci

      - name: Rebuild native deps for Electron
        working-directory: Electron
        run: npx --maxsockets 3 electron-builder install-app-deps

      - name: Build workspace
        working-directory: Electron
        run: npm run build

      # fetch-pi-runtime extracts the Node zip with Windows PowerShell's
      # Expand-Archive. Under the default pwsh shell the child inherits PS7's
      # PSModulePath and loads the wrong Archive module, so run it from cmd.
      - name: Prepare Windows embedded runtime
        working-directory: Electron
        shell: cmd
        run: npm run runtime:prepare:win

      - name: Package Windows x64
        working-directory: Electron
        env:
          CUA_TARGET_PLATFORM: win32
          CUA_TARGET_ARCH: x64
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # Build scripts call `tar` on D:\ paths; Git Bash's GNU tar reads the
          # drive colon as a remote host. Use Windows' bsdtar, as on a local build.
          export PATH="/c/Windows/System32:$PATH"
          version="${RELEASE_TAG#release-win-}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be release-win-<x.y.z>, got $RELEASE_TAG" >&2; exit 1; }
          node scripts/fetch-cua-driver.mjs
          # node-pty was already rebuilt for Electron by install-app-deps (and ships
          # N-API win32 prebuilds); electron-builder's second rebuild links winpty
          # against a mismatched MSVC STL on the hosted image, so skip it.
          node scripts/package-electron-target.mjs --platform win32 --arch x64 -- --win --x64 --config.extraMetadata.version="$version" --config.npmRebuild=false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: pipiui-windows-x64
          path: build/*.exe
          if-no-files-found: error
