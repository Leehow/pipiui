<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PipiUI · 我的电脑</title><link rel="stylesheet" href="/mobile/style.css"><script type="module" src="/mobile/app.js"></script></head><body><main><header>PipiUI</header><section id="account" hidden><h1 id="title">注册账号</h1><form><label>用户名<input name="user" required minlength="3" maxlength="80" autocomplete="username" autocapitalize="none"></label><label>密码<input name="password" type="password" required minlength="10" maxlength="256" autocomplete="new-password" placeholder="至少 10 位"></label><button id="submit">注册</button></form><button class="secondary" id="switch">已有账号，登录</button></section><section id="devices" hidden><h1>我的电脑</h1><p id="identity"></p><button id="bind" hidden>将这台电脑绑定到我的账号</button><div id="list"></div><button class="secondary" id="logout">退出登录</button></section><aside hidden role="alert"><span></span><button aria-label="关闭提示">×</button></aside></main></body></html>
