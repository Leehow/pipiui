<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PipiUI</title>
    <style>
      /* Pre-React base color: matches the shell defaults in app.css
         (--bg #17181c dark / #f5f5f7 light) so the window never shows the
         white system background before first paint or behind heavy remounts. */
      html { background: #17181c }
      html.pipiui-theme-light { background: #f5f5f7 }
    </style>
    <script>
      // Resolve the same theme useShellTheme resolves (stored choice wins,
      // else prefers-color-scheme) before any paint, synchronously.
      try {
        var stored = localStorage.getItem('pipiui.theme')
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = stored ? stored === 'dark' : Boolean(prefersDark)
        if (!dark) document.documentElement.classList.add('pipiui-theme-light')
      } catch (e) { /* unreadable storage: keep dark default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src.tsx"></script>
  </body>
</html>
